<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MediBridge · Admin Portal</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:#f4f8fa;color:#16303d;display:grid;place-items:center;min-height:100vh}.box{width:410px;background:#fff;border-radius:22px;padding:34px;box-shadow:0 20px 50px #0c1c2b14}.logo{font-size:30px;font-weight:800;color:#0c1c2b}.tag{font-size:11px;color:#17a091;font-weight:700;letter-spacing:1px;margin:5px 0 25px}.adminmark{background:#e8f7f4;color:#126b60;border-radius:12px;padding:10px;font-size:12px;margin-bottom:18px}label{font-size:12px;color:#71828c}input{width:100%;padding:13px;margin:6px 0 15px;border:1px solid #dfe8ec;border-radius:11px}button{width:100%;padding:13px;border:0;border-radius:11px;background:#0b1f2a;color:white;font-weight:700;cursor:pointer}.demo{margin-top:18px;padding:12px;background:#eef5f6;border-radius:12px;font-size:12px;color:#315660}.err{background:#fff0f0;color:#b33;padding:10px;border-radius:10px;font-size:12px;margin-bottom:14px}a{color:#17a091;text-decoration:none;font-weight:700;font-size:12px}</style></head><body><div class="box"><div class="logo">MediBridge</div><div class="tag">ADMIN · PHARMACY · NFC/RFID OPERATIONS</div><div class="adminmark">🔐 Separate operations portal — pharmacy orders, inventory, patient NFC cards and delivery-tag verification are managed here.</div>{% if error %}<div class="err">{{error}}</div>{% endif %}<form method="post"><label>Admin email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" required><button>Open Admin Console</button></form><div style="margin-top:18px;text-align:center"><a href="/login">← Back to patient / doctor login</a></div><div style="margin-top:10px;text-align:center"><a href="/hospital/login">🏥 Hospital Partner Portal →</a></div><div style="margin-top:10px;text-align:center"><a href="/delivery/login">🚚 Delivery Agent Portal →</a></div></div></body></html>
